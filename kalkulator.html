<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Modern Interaktif</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome untuk Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar untuk display & history */
        .custom-scrollbar::-webkit-scrollbar {
            height: 4px;
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.4);
            border-radius: 4px;
        }
        
        /* Animation effect saat tombol ditekan */
        .btn-press {
            transition: all 0.1s ease;
        }
        .btn-press:active, .btn-pressed {
            transform: scale(0.93);
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 transition-colors duration-300 font-sans">

    <!-- Container Utama Kalkulator -->
    <div class="w-full max-w-md bg-white dark:bg-slate-800 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-700/60 overflow-hidden transition-all duration-300">
        
        <!-- Header & Control Bar -->
        <div class="flex items-center justify-between px-6 pt-5 pb-2">
            <div class="flex items-center space-x-2">
                <span class="w-3 h-3 rounded-full bg-red-500 inline-block"></span>
                <span class="w-3 h-3 rounded-full bg-yellow-500 inline-block"></span>
                <span class="w-3 h-3 rounded-full bg-green-500 inline-block"></span>
                <span class="ml-2 text-xs font-semibold uppercase tracking-wider text-slate-400">Calculator</span>
            </div>
            
            <div class="flex items-center gap-2">
                <!-- Tombol Hapus Riwayat -->
                <button id="btn-clear-history" title="Hapus Riwayat" class="p-2 text-slate-400 hover:text-red-500 dark:hover:text-red-400 transition-colors rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700/50">
                    <i class="fa-solid me-1 fa-trash-can text-sm"></i>
                </button>
                <!-- Toggle Dark / Light Theme -->
                <button id="theme-toggle" class="p-2 text-slate-400 hover:text-amber-500 dark:hover:text-amber-400 transition-colors rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700/50" title="Ubah Tema">
                    <i id="theme-icon" class="fa-solid fa-moon text-lg"></i>
                </button>
            </div>
        </div>

        <!-- Section Display Screen -->
        <div class="px-6 py-4 bg-slate-50/50 dark:bg-slate-800/50 flex flex-col items-end justify-end border-b border-slate-100 dark:border-slate-700/40">
            <!-- Riwayat Ekspresi Terakhir -->
            <div id="history-display" class="h-6 text-sm text-slate-400 dark:text-slate-400 font-mono overflow-x-auto whitespace-nowrap w-full text-right custom-scrollbar">
                &nbsp;
            </div>
            <!-- Display Angka/Input Utama -->
            <div id="main-display" class="w-full text-right text-4xl sm:text-5xl font-bold font-mono tracking-tight text-slate-900 dark:text-white overflow-x-auto whitespace-nowrap custom-scrollbar py-1">
                0
            </div>
        </div>

        <!-- Grid Pad Tombol Kalkulator -->
        <div class="p-6 grid grid-cols-4 gap-3 bg-slate-50 dark:bg-slate-800/80">
            
            <!-- Baris 1 -->
            <button data-action="clear" class="btn-press font-semibold text-lg p-4 rounded-2xl bg-red-100 text-red-600 hover:bg-red-200 dark:bg-red-950/40 dark:text-red-400 dark:hover:bg-red-900/50 transition-colors shadow-sm">
                AC
            </button>
            <button data-action="delete" class="btn-press font-semibold text-lg p-4 rounded-2xl bg-slate-200/70 text-slate-700 hover:bg-slate-300 dark:bg-slate-700/60 dark:text-slate-200 dark:hover:bg-slate-700 transition-colors shadow-sm">
                <i class="fa-solid fa-backspace"></i>
            </button>
            <button data-action="percent" class="btn-press font-semibold text-lg p-4 rounded-2xl bg-slate-200/70 text-slate-700 hover:bg-slate-300 dark:bg-slate-700/60 dark:text-slate-200 dark:hover:bg-slate-700 transition-colors shadow-sm">
                %
            </button>
            <button data-operator="/" class="btn-press font-semibold text-xl p-4 rounded-2xl bg-blue-500 text-white hover:bg-blue-600 dark:bg-blue-600 dark:hover:bg-blue-500 transition-colors shadow-md shadow-blue-500/20">
                ÷
            </button>

            <!-- Baris 2 -->
            <button data-number="7" class="btn-press font-semibold text-xl p-4 rounded-2xl bg-white dark:bg-slate-700 text-slate-800 dark:text-slate-100 hover:bg-slate-100 dark:hover:bg-slate-600 transition-colors shadow-sm border border-slate-100 dark:border-slate-600/50">
                7
            </button>
            <button data-number="8" class="btn-press font-semibold text-xl p-4 rounded-2xl bg-white dark:bg-slate-700 text-slate-800 dark:text-slate-100 hover:bg-slate-100 dark:hover:bg-slate-600 transition-colors shadow-sm border border-slate-100 dark:border-slate-600/50">
                8
            </button>
            <button data-number="9" class="btn-press font-semibold text-xl p-4 rounded-2xl bg-white dark:bg-slate-700 text-slate-800 dark:text-slate-100 hover:bg-slate-100 dark:hover:bg-slate-600 transition-colors shadow-sm border border-slate-100 dark:border-slate-600/50">
                9
            </button>
            <button data-operator="*" class="btn-press font-semibold text-xl p-4 rounded-2xl bg-blue-500 text-white hover:bg-blue-600 dark:bg-blue-600 dark:hover:bg-blue-500 transition-colors shadow-md shadow-blue-500/20">
                ×
            </button>

            <!-- Baris 3 -->
            <button data-number="4" class="btn-press font-semibold text-xl p-4 rounded-2xl bg-white dark:bg-slate-700 text-slate-800 dark:text-slate-100 hover:bg-slate-100 dark:hover:bg-slate-600 transition-colors shadow-sm border border-slate-100 dark:border-slate-600/50">
                4
            </button>
            <button data-number="5" class="btn-press font-semibold text-xl p-4 rounded-2xl bg-white dark:bg-slate-700 text-slate-800 dark:text-slate-100 hover:bg-slate-100 dark:hover:bg-slate-600 transition-colors shadow-sm border border-slate-100 dark:border-slate-600/50">
                5
            </button>
            <button data-number="6" class="btn-press font-semibold text-xl p-4 rounded-2xl bg-white dark:bg-slate-700 text-slate-800 dark:text-slate-100 hover:bg-slate-100 dark:hover:bg-slate-600 transition-colors shadow-sm border border-slate-100 dark:border-slate-600/50">
                6
            </button>
            <button data-operator="-" class="btn-press font-semibold text-xl p-4 rounded-2xl bg-blue-500 text-white hover:bg-blue-600 dark:bg-blue-600 dark:hover:bg-blue-500 transition-colors shadow-md shadow-blue-500/20">
                −
            </button>

            <!-- Baris 4 -->
            <button data-number="1" class="btn-press font-semibold text-xl p-4 rounded-2xl bg-white dark:bg-slate-700 text-slate-800 dark:text-slate-100 hover:bg-slate-100 dark:hover:bg-slate-600 transition-colors shadow-sm border border-slate-100 dark:border-slate-600/50">
                1
            </button>
            <button data-number="2" class="btn-press font-semibold text-xl p-4 rounded-2xl bg-white dark:bg-slate-700 text-slate-800 dark:text-slate-100 hover:bg-slate-100 dark:hover:bg-slate-600 transition-colors shadow-sm border border-slate-100 dark:border-slate-600/50">
                2
            </button>
            <button data-number="3" class="btn-press font-semibold text-xl p-4 rounded-2xl bg-white dark:bg-slate-700 text-slate-800 dark:text-slate-100 hover:bg-slate-100 dark:hover:bg-slate-600 transition-colors shadow-sm border border-slate-100 dark:border-slate-600/50">
                3
            </button>
            <button data-operator="+" class="btn-press font-semibold text-xl p-4 rounded-2xl bg-blue-500 text-white hover:bg-blue-600 dark:bg-blue-600 dark:hover:bg-blue-500 transition-colors shadow-md shadow-blue-500/20">
                +
            </button>

            <!-- Baris 5 -->
            <button data-action="toggle-sign" class="btn-press font-semibold text-xl p-4 rounded-2xl bg-white dark:bg-slate-700 text-slate-800 dark:text-slate-100 hover:bg-slate-100 dark:hover:bg-slate-600 transition-colors shadow-sm border border-slate-100 dark:border-slate-600/50">
                ±
            </button>
            <button data-number="0" class="btn-press font-semibold text-xl p-4 rounded-2xl bg-white dark:bg-slate-700 text-slate-800 dark:text-slate-100 hover:bg-slate-100 dark:hover:bg-slate-600 transition-colors shadow-sm border border-slate-100 dark:border-slate-600/50">
                0
            </button>
            <button data-action="decimal" class="btn-press font-semibold text-xl p-4 rounded-2xl bg-white dark:bg-slate-700 text-slate-800 dark:text-slate-100 hover:bg-slate-100 dark:hover:bg-slate-600 transition-colors shadow-sm border border-slate-100 dark:border-slate-600/50">
                .
            </button>
            <button data-action="calculate" class="btn-press font-semibold text-xl p-4 rounded-2xl bg-emerald-500 text-white hover:bg-emerald-600 dark:bg-emerald-600 dark:hover:bg-emerald-500 transition-colors shadow-md shadow-emerald-500/20">
                =
            </button>
        </div>

        <!-- Footer Bantuan Input Keyboard -->
        <div class="px-6 py-3 bg-slate-100 dark:bg-slate-900/60 text-center text-xs text-slate-400 border-t border-slate-200/50 dark:border-slate-700/50">
            Support Keyboard: <span class="font-mono bg-slate-200 dark:bg-slate-800 px-1 rounded">0-9</span>, <span class="font-mono bg-slate-200 dark:bg-slate-800 px-1 rounded">+ - * /</span>, <span class="font-mono bg-slate-200 dark:bg-slate-800 px-1 rounded">Enter</span>, <span class="font-mono bg-slate-200 dark:bg-slate-800 px-1 rounded">Esc</span>
        </div>
    </div>

    <!-- Script Logika Kalkulator -->
    <script>
        // State Variabel Kalkulator
        let currentInput = '0';
        let previousInput = '';
        let operator = null;
        let shouldResetDisplay = false;

        // Elemen DOM
        const mainDisplay = document.getElementById('main-display');
        const historyDisplay = document.getElementById('history-display');
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const btnClearHistory = document.getElementById('btn-clear-history');

        // Initial Theme Check (Cek preferensi sistem / dark mode)
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
            themeIcon.className = 'fa-solid fa-sun text-lg';
        }

        // Toggle Dark Mode
        themeToggleBtn.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            if (document.documentElement.classList.contains('dark')) {
                themeIcon.className = 'fa-solid fa-sun text-lg';
            } else {
                themeIcon.className = 'fa-solid fa-moon text-lg';
            }
        });

        // Update tampilan Layar
        function updateDisplay() {
            mainDisplay.innerText = currentInput;
            
            // Format operator visual di riwayat
            let displayOperator = operator;
            if (operator === '*') displayOperator = '×';
            if (operator === '/') displayOperator = '÷';
            if (operator === '-') displayOperator = '−';

            if (operator !== null) {
                historyDisplay.innerText = `${previousInput} ${displayOperator}`;
            } else {
                historyDisplay.innerHTML = '&nbsp;';
            }
        }

        // Penanganan Input Angka
        function appendNumber(number) {
            if (currentInput === '0' || shouldResetDisplay) {
                currentInput = number;
                shouldResetDisplay = false;
            } else {
                // Cegah pengetikan berlebihan yang bikin layar jebol
                if (currentInput.length >= 12) return;
                currentInput += number;
            }
            updateDisplay();
        }

        // Penanganan Titik Desimal
        function appendDecimal() {
            if (shouldResetDisplay) {
                currentInput = '0.';
                shouldResetDisplay = false;
                updateDisplay();
                return;
            }
            if (!currentInput.includes('.')) {
                currentInput += '.';
                updateDisplay();
            }
        }

        // Penanganan Pilihan Operator (+, -, *, /)
        function chooseOperator(op) {
            if (operator !== null && !shouldResetDisplay) {
                calculateResult();
            }
            previousInput = currentInput;
            operator = op;
            shouldResetDisplay = true;
            updateDisplay();
        }

        // Kalkulasi Hasil
        function calculateResult() {
            if (operator === null || shouldResetDisplay) return;

            let prev = parseFloat(previousInput);
            let current = parseFloat(currentInput);
            let result = 0;

            if (isNaN(prev) || isNaN(current)) return;

            // Logika Operasi Matematika
            switch (operator) {
                case '+':
                    result = prev + current;
                    break;
                case '-':
                    result = prev - current;
                    break;
                case '*':
                    result = prev * current;
                    break;
                case '/':
                    // Penanganan Error Pembagian Nol
                    if (current === 0) {
                        currentInput = 'Error (Div 0)';
                        operator = null;
                        previousInput = '';
                        shouldResetDisplay = true;
                        updateDisplay();
                        return;
                    }
                    result = prev / current;
                    break;
                default:
                    return;
            }

            // Tampilkan riwayat lengkap kalkulasi
            let displayOperator = operator === '*' ? '×' : operator === '/' ? '÷' : operator === '-' ? '−' : operator;
            historyDisplay.innerText = `${previousInput} ${displayOperator} ${currentInput} =`;

            // Pembulatan angka desimal panjang agar rapi
            result = Math.round(result * 100000000) / 100000000;
            currentInput = result.toString();
            operator = null;
            previousInput = '';
            shouldResetDisplay = true;
            mainDisplay.innerText = currentInput;
        }

        // Operasi Persen (%)
        function computePercent() {
            let val = parseFloat(currentInput);
            if (!isNaN(val)) {
                currentInput = (val / 100).toString();
                updateDisplay();
            }
        }

        // Toggle Positif/Negatif (±)
        function toggleSign() {
            if (currentInput === '0' || currentInput === 'Error (Div 0)') return;
            currentInput = (parseFloat(currentInput) * -1).toString();
            updateDisplay();
        }

        // Hapus Karakter Terakhir (Backspace)
        function deleteLast() {
            if (shouldResetDisplay) return;
            if (currentInput.length === 1 || currentInput === 'Error (Div 0)') {
                currentInput = '0';
            } else {
                currentInput = currentInput.slice(0, -1);
            }
            updateDisplay();
        }

        // Reset Total (All Clear)
        function clearAll() {
            currentInput = '0';
            previousInput = '';
            operator = null;
            shouldResetDisplay = false;
            updateDisplay();
        }

        // Hapus Hanya Riwayat Teks
        btnClearHistory.addEventListener('click', () => {
            historyDisplay.innerHTML = '&nbsp;';
        });

        // Event Listener Tombol UI
        document.querySelectorAll('button[data-number]').forEach(btn => {
            btn.addEventListener('click', () => appendNumber(btn.dataset.number));
        });

        document.querySelectorAll('button[data-operator]').forEach(btn => {
            btn.addEventListener('click', () => chooseOperator(btn.dataset.operator));
        });

        document.querySelectorAll('button[data-action]').forEach(btn => {
            btn.addEventListener('click', () => {
                const action = btn.dataset.action;
                if (action === 'clear') clearAll();
                if (action === 'delete') deleteLast();
                if (action === 'decimal') appendDecimal();
                if (action === 'percent') computePercent();
                if (action === 'toggle-sign') toggleSign();
                if (action === 'calculate') calculateResult();
            });
        });

        // Event Listener Input Keyboard
        window.addEventListener('keydown', (e) => {
            // Mencegah scroll / shortcut default browser untuk beberapa tombol
            if (['/', '*', '+', '-', 'Enter', 'Backspace', 'Escape'].includes(e.key)) {
                e.preventDefault();
            }

            // Animasi efek tombol keyboard
            let selector = '';

            // Mapping key keyboard ke kalkulator
            if (e.key >= '0' && e.key <= '9') {
                appendNumber(e.key);
                selector = `button[data-number="${e.key}"]`;
            } else if (e.key === '.') {
                appendDecimal();
                selector = `button[data-action="decimal"]`;
            } else if (e.key === '+' || e.key === '-' || e.key === '*' || e.key === '/') {
                chooseOperator(e.key);
                selector = `button[data-operator="${e.key}"]`;
            } else if (e.key === 'Enter' || e.key === '=') {
                calculateResult();
                selector = `button[data-action="calculate"]`;
            } else if (e.key === 'Backspace') {
                deleteLast();
                selector = `button[data-action="delete"]`;
            } else if (e.key === 'Escape') {
                clearAll();
                selector = `button[data-action="clear"]`;
            } else if (e.key === '%') {
                computePercent();
                selector = `button[data-action="percent"]`;
            }

            // Efek visual highlight tombol keyboard saat ditekan
            if (selector) {
                const targetBtn = document.querySelector(selector);
                if (targetBtn) {
                    targetBtn.classList.add('btn-pressed');
                    setTimeout(() => targetBtn.classList.remove('btn-pressed'), 120);
                }
            }
        });
    </script>
</body>
</html>
